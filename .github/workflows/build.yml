name: Creer APK Mon Budget

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer Capacitor et configurer Android
        run: |
          npm install -g @capacitor/cli
          npm install @capacitor/core @capacitor/android
          npx cap init "Mon Budget" "com.monbudget.app" --web-dir www --npm-client npm
          npx cap add android
          npx cap sync

      - name: Compiler le fichier APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publier APK a telecharger
        uses: actions/upload-artifact@v4
        with:
          name: Mon-Budget-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
